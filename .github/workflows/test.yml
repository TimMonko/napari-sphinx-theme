name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c45a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install -e .
          pip install pytest
      - name: Run unit tests
        run: python -m pytest tests/ -q
